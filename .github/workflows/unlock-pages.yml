name: Destravar GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unlock-pages.yml"

permissions:
  contents: read
  deployments: write

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Encerrar deployments presos
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: "github-pages",
              per_page: 30
            });
            let unlocked = 0;
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 1
              });
              const state = statuses[0]?.state;
              if (["queued", "pending", "in_progress"].includes(state)) {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Deployment preso encerrado para liberar o GitHub Pages"
                });
                unlocked++;
              }
            }
            core.info(`Deployments liberados: ${unlocked}`);
